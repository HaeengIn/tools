[project]
name = "tools"
version = "0.1.0"
readme = "README.md"
authors = [{ name = "HaeengIn", email = "haeengin@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "auto-template>=1.0.0",
    "fastapi[standard]>=0.161.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tools = "tools:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["zttp>=0.0.35"]

[tool.ruff.lint]
ignore = ["BLE001"]
