[project]
name = "tools"
version = "0.1.0"
readme = "README.md"
authors = [{ name = "HaeengIn", email = "haeengin@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "auto-template>=1.0.0",
    "fastapi[standard]>=0.161.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyvips>=3.2.0",
    "pyvips-binary>=8.18.7 ; sys_platform == 'win32'",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tools = "tools:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["zttp>=0.0.35"]

[tool.ruff.lint]
ignore = ["BLE001"]
